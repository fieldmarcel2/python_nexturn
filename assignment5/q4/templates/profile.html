<!DOCTYPE html>
<html>

<head>

    <title>File Upload</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <h2>Upload File</h2>

    <form
        method="POST"
        enctype="multipart/form-data"
    >

        <input
            type="file"
            name="file"
            required
        >

        <button type="submit">
            Upload
        </button>

    </form>


    <h3>Uploaded Files</h3>

    <ul>

        {% for file in files %}

        <li>

            <a href="{{ url_for('uploaded_file', filename=file) }}">
                {{ file }}
            </a>

        </li>

        {% endfor %}

    </ul>


    <a href="/logout">
        Logout
    </a>

</body>

</html>
